name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GeoJSON geometry
        run: npm run validate:geometry
