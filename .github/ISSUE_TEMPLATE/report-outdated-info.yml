name: Report outdated or incorrect info
description: Flag a project whose details are out of date or wrong.
title: "[Correction]: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the data accurate! Please include a source so the correction can be verified.
  - type: input
    id: project
    attributes:
      label: Project
      description: The project's slug or URL on the site.
      placeholder: e.g. austin-light-rail-phase-1 or https://.../projects/austin-light-rail-phase-1/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Which field(s) are incorrect or outdated, and what should they say?
      placeholder: e.g. Status should be "Under construction" — groundbreaking happened in March.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source for the correction
      description: One URL per line. Official agency sources preferred.
      placeholder: |
        https://...
    validations:
      required: true
